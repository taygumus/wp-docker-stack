x-mysql-app-env: &mysql-app-env
  MYSQL_HOST: database
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: ${DATABASE_NAME}
  MYSQL_USER: ${DATABASE_USER}
  MYSQL_PASSWORD: ${DATABASE_PASSWORD}

x-wordpress-db-env: &wordpress-db-env
  WORDPRESS_DB_HOST: database:3306
  WORDPRESS_DB_NAME: ${DATABASE_NAME}
  WORDPRESS_DB_USER: ${DATABASE_USER}
  WORDPRESS_DB_PASSWORD: ${DATABASE_PASSWORD}
  WORDPRESS_PATH: /var/www/html

services:
  database:
    image: mysql:8.4.7
    restart: unless-stopped
    environment:
      <<: *mysql-app-env
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD}
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h localhost -u root -p"${DATABASE_ROOT_PASSWORD}"
      timeout: 30s
      retries: 10
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - internal

  wordpress:
    depends_on:
      - database
    image: wordpress:7.0.3-fpm-alpine
    restart: unless-stopped
    environment:
      <<: *wordpress-db-env
    volumes:
      - wordpress:/var/www/html
    networks:
      - internal

  nginx:
    depends_on:
      - wordpress
    image: nginx:1.29.2-alpine
    restart: unless-stopped
    environment:
      SERVER_NAME: ${SERVER_NAME}
    volumes:
      - wordpress:/var/www/html
    networks:
      - internal

  wp-init:
    depends_on:
      - wordpress
      - database
    image: wordpress:cli-2.10.0
    environment:
      <<: *wordpress-db-env
      SITE_URL: ${SITE_URL}
      SKIP_COLUMNS: ${SKIP_COLUMNS}
      SKIP_WP_INIT: ${SKIP_WP_INIT}
    volumes:
      - wordpress:/var/www/html
    entrypoint: ["/scripts/wp-init/entrypoint.sh"]
    networks:
      - internal

  db-backup:
    depends_on:
      - database
    image: mysql:8.4.7
    environment:
      <<: *mysql-app-env
      DB_BACKUP_INITIAL_DELAY: ${DATABASE_BACKUP_INITIAL_DELAY}
      DB_BACKUP_INTERVAL: ${DATABASE_BACKUP_INTERVAL}
      DB_BACKUP_MAX_FILES: ${DATABASE_BACKUP_MAX_FILES}
      SKIP_DB_BACKUP: ${SKIP_DB_BACKUP}
    tmpfs:
      - /var/lib/mysql
    entrypoint: ["/scripts/db-backup/entrypoint.sh"]
    networks:
      - internal

volumes:
  db_data:
  wordpress:

networks:
  internal:
    driver: bridge
